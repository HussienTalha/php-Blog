version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-app
    restart: always
    working_dir: /var/www/
   
    ports:
      - "9000"  
    networks:
      - app-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=myapp
      - DB_USERNAME=root
      - DB_PASSWORD=root

  nginx:
    image: nginx:1.19-alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "${PORT:-8080}:80"  
    depends_on:
      - app
    networks:
      - app-network

  mysql:
    image: mariadb:10.6
    container_name: blog-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
    ports:
      - "3306" 
    networks:
      - app-network
  
networks:
   app-network:
       driver: bridge